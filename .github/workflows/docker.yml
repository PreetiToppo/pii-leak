name: Docker

# Build-only smoke test: proves the image builds and the CLI starts. Nothing is pushed here.
on:
  pull_request:
    paths: ["Dockerfile", ".dockerignore", "pyproject.toml", "src/**"]
  push:
    branches: [main]
    paths: ["Dockerfile", ".dockerignore", "pyproject.toml", "src/**"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: piileak:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: CLI starts and the spaCy model is present
        run: |
          docker run --rm piileak:test --help
          docker run --rm --entrypoint python piileak:test -c "import spacy; spacy.load('en_core_web_sm'); print('model ok')"
      - name: Runs as a non-root user
        run: test "$(docker run --rm --entrypoint id piileak:test -u)" != "0"
