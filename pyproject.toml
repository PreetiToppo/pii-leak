[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "piileak"
version = "0.1.0"
description = "CI gate that catches PII leaks introduced by API version migrations"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Preeti Toppo" }]
keywords = ["pii", "api", "openapi", "swagger", "security", "ci", "aadhaar", "presidio"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.5",
  "pyyaml>=6",
  "httpx>=0.27",
  "presidio-analyzer>=2.2.354",
  "spacy>=3.7",
  "fastapi>=0.110",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-cov", "ruff", "mypy", "pre-commit", "types-PyYAML", "build", "twine"]

[project.urls]
Homepage = "https://github.com/PreetiToppo/pii-leak"
Issues = "https://github.com/PreetiToppo/pii-leak/issues"
Changelog = "https://github.com/PreetiToppo/pii-leak/blob/main/CHANGELOG.md"

[project.scripts]
piileak = "piileak.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
piileak = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["piileak"]

[tool.coverage.report]
fail_under = 85

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
